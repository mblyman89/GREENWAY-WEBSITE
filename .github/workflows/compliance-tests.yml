# S-14 (GAP M-11) — compliance test harness on every PR and push to main.
# Pure-module tests only: no database, no browser, no secrets. This is the
# WAC 314-55-509 mitigation evidence — statute-encoding modules cannot drift
# without a red X on the PR.
name: compliance-tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Compliance test harness (vitest + golden files)
        run: npm run test:compliance
      - name: Pure self-test runner (tsx)
        run: npx tsx scripts/compliance/run-pure-selftests.ts
      # Scoped lint: the harness + the pure statute-encoding modules it tests.
      # (Full-repo `npm run lint` carries pre-existing UI warnings/errors that
      # predate this workflow and are tracked separately — linting the whole
      # app here would mask compliance regressions behind unrelated noise.)
      - name: Lint (compliance scope)
        run: >
          npx eslint tests scripts/compliance vitest.config.ts
          src/lib/compliance src/lib/orders src/lib/reports src/lib/security
          src/lib/naming src/lib/specials src/lib/promotions src/lib/medical
          src/lib/supabase src/lib/printing

