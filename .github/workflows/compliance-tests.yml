# S-14 (GAP M-11) — compliance test harness on every PR and push to main.
# Pure-module tests only: no database, no browser, no secrets. This is the
# WAC 314-55-509 mitigation evidence — statute-encoding modules cannot drift
# without a red X on the PR.
name: compliance-tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  compliance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # fetch-depth 0 (full history) is required by the commit authorship
          # check below. The default shallow checkout has no merge base, so the
          # check could only ever see HEAD. See the comment on that step.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # ======================================================================
      # THE FILE A RASPBERRY PI DOWNLOADS MUST BE THE FILE THAT WAS REVIEWED.
      #
      # install.sh fetches "${SITE}/announcer/greenway_announcer.py", which
      # Next.js serves from public/announcer/. So the agent exists twice, and
      # only the served copy is the one a speaker in the shop installs.
      #
      # Three PRs (#1181, #1182, #1183) changed pi-agent/greenway_announcer.py
      # and not the served copy. The repo looked correct. The served agent fell
      # 1400 lines behind, and the owner was given a command - use-output auto
      # - that did not exist in the file his Pi would have downloaded.
      #
      # A drift guard DID exist in tests/compliance/announcer-admin.test.ts and
      # was red the whole time; it was simply not looked at before merging.
      # This step runs first and costs milliseconds, so the failure arrives at
      # the top of the log in plain language, naming the one command that fixes
      # it, instead of being one assertion inside a 16,000-test run.
      #
      # tests/compliance/announcer-admin.test.ts pins this step by name.
      - name: The Pi downloads what we reviewed (public/announcer sync)
        run: npm run announcer:check
      - name: Compliance test harness (vitest + golden files)
        run: npm run test:compliance
      - name: Pure self-test runner (tsx)
        run: npx tsx scripts/compliance/run-pure-selftests.ts
      # ======================================================================
      # THE COMMIT AUTHOR EMAIL IS A DEPLOYMENT PRECONDITION.
      #
      # Slice 13 passed every job in this file and Vercel never built it. The
      # dashboard said BLOCKED, not "failed", and there were no build logs at
      # all - because no build ever started.
      #
      # The cause was the git author email:
      #
      #   3d25026  dev@greenwaymarijuana.com  -> GitHub user mblyman89  -> deployed
      #   10eb1a6  superninja@ninjatech.ai    -> no GitHub user         -> BLOCKED
      #
      # Vercel's troubleshooting documentation, under "Build Logs not
      # available", lists the preconditions that make a deployment fail without
      # producing logs. One of them is that commits were made from a
      # contributor that is not a team member. Vercel resolves the git author
      # email to a GitHub account and checks that account against the team; an
      # address belonging to no account cannot resolve, so the deployment is
      # refused before a build container is allocated.
      #
      # Nothing in CI looked at the author email, so a green pipeline and an
      # undeployable commit were indistinguishable from the inside. That is
      # exactly the failure mode standing rule 39 exists to prevent, so the
      # check runs here where it can fail a pull request.
      #
      # tests/compliance/ci-checks-commit-authorship.test.ts pins this step and
      # the fetch-depth above by name so neither can quietly disappear.
      # ======================================================================
      - name: Commit authorship (the Vercel deployment precondition)
        run: npx tsx scripts/compliance/verify-commit-authorship.ts
      # ======================================================================
      # STANDING RULE 39: a verifier nobody runs is a verifier that approves
      # everything.
      #
      # scripts/verify-verbatim-quotes.ts is the mechanical enforcement of rule
      # 24/35 - "the quote is sacred". It checks every authority quotation in
      # GUIDANCE_AUTHORITIES against the mirrored source on disk, and it exits
      # non-zero on any mismatch. It has done so, correctly, since books-25.
      #
      # It was never wired into CI. For dozens of slices the only thing invoking
      # it was me, by hand, when I happened to remember. That was discovered by
      # mutations M11 and M12 of scripts/mutate-books-56-lessons.py, which
      # altered the text of registry quotations, were predicted RED, and came
      # back GREEN: nothing in the automated pipeline was looking. A quote could
      # have been silently reworded on any branch and merged green.
      #
      # It takes two seconds. There was never a cost reason to leave it out.
      # tests/compliance/ci-runs-the-verbatim-verifier.test.ts pins this step by
      # name so it cannot quietly disappear again.
      - name: Verbatim quote verifier (rule 24/35)
        run: npx tsx scripts/verify-verbatim-quotes.ts
      # ======================================================================
      # STANDING RULE 39 AGAIN, IN THE ONE PLACE IT WAS STILL MISSING.
      #
      # `next build` type-checks the app, and the `build` job below runs it, so
      # for a long time it looked like TypeScript was covered. It is not, and
      # the gap is not a matter of opinion - it is written into Next itself.
      # node_modules/next/dist/lib/typescript/runTypeCheck.js builds this filter:
      #
      #     const ignoreRegex = [
      #       /[\\/]__(?:tests|mocks)__[\\/]/,
      #       /(?<=[\\/.])(?:spec|test)\.[^\\/]+$/
      #     ];
      #     ... .filter((d) => !(d.file && regexIgnoredFile.test(d.file.fileName)))
      #
      # Every diagnostic whose file matches `*.test.ts` is DISCARDED before the
      # first error is chosen. So a type error in tests/ cannot fail `next build`,
      # cannot fail Vercel, and - because vitest transpiles without type-checking
      # - cannot fail the test suite either. It was invisible to all three.
      #
      # That is not hypothetical. Slice 13 merged green with three real errors in
      # tests/compliance/slice13-inventory-filtering.test.ts (TS2353: 'fields'
      # does not exist in type 'InventoryListInput<PageLot>'), and `npx tsc
      # --noEmit` reported all three in seconds. tsconfig.json deliberately
      # includes tests, so the types were always meant to be checked; nothing was
      # doing it.
      #
      # This step is the whole-repo type check on the same config the editor uses.
      # tests/compliance/ci-runs-the-typechecker.test.ts pins it by name so it
      # cannot quietly disappear the way the verbatim verifier once did.
      - name: Type check (tsc --noEmit, includes tests/)
        # NODE_OPTIONS for the same reason the build job sets it: this repo is
        # now large enough that a whole-program check exceeds Node's DEFAULT
        # ~2 GB heap. The first run of this step died with
        # "FATAL ERROR: Ineffective mark-compacts near heap limit" and exit 134
        # at ~2044 MB - an OOM, NOT a type error. Left unfixed it would be a
        # flaky red that teaches everyone to ignore this job, which is exactly
        # how the hole this step exists to close was opened in the first place.
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run typecheck
      # Scoped lint: the harness + the pure statute-encoding modules it tests.
      # (Full-repo `npm run lint` carries pre-existing UI warnings/errors that
      # predate this workflow and are tracked separately — linting the whole
      # app here would mask compliance regressions behind unrelated noise.)
      - name: Lint (compliance scope)
        run: >
          npx eslint tests scripts/compliance vitest.config.ts
          src/lib/compliance src/lib/orders src/lib/reports src/lib/security
          src/lib/naming src/lib/specials src/lib/promotions src/lib/medical
          src/lib/supabase src/lib/printing

  # ==========================================================================
  # STANDING RULE 58: a test that reads SQL as text has not run the SQL.
  #
  # Michael applies migrations BY HAND, one at a time, in the Supabase SQL
  # editor. 0195 carried 545 lines of green text-reading tests and still failed
  # for him. Text assertions cannot prove a file parses, that the statements are
  # in a runnable order, or that a re-run is safe. Only a database can.
  #
  # This job is separate from `compliance` on purpose: it needs a real postgres,
  # so it must not be able to make the pure-module suite look broken, and the
  # pure suite must not have to wait for a service container.
  # ==========================================================================
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: greenway
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client
      # The migrations are written for Supabase, so they assume Supabase exists:
      # the auth and storage schemas, the three PostgREST roles, and auth.uid().
      # Without these the very first migration fails for a reason that has
      # nothing to do with the change under review.
      - name: Bootstrap the Supabase environment the migrations assume
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d greenway -v ON_ERROR_STOP=1 <<'SQL'
          create extension if not exists pgcrypto;
          create schema if not exists auth;
          create schema if not exists storage;
          do $$ begin
            if not exists (select 1 from pg_roles where rolname='anon')
              then create role anon nologin noinherit; end if;
            if not exists (select 1 from pg_roles where rolname='authenticated')
              then create role authenticated nologin noinherit; end if;
            if not exists (select 1 from pg_roles where rolname='service_role')
              then create role service_role nologin noinherit bypassrls; end if;
          end $$;
          create or replace function auth.uid() returns uuid language sql stable as
            $f$ select nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $f$;
          create or replace function auth.role() returns text language sql stable as
            $f$ select coalesce(nullif(current_setting('request.jwt.claim.role', true), ''), 'service_role') $f$;
          create or replace function auth.email() returns text language sql stable as
            $f$ select nullif(current_setting('request.jwt.claim.email', true), '') $f$;
          create table if not exists auth.users (
            id uuid primary key default gen_random_uuid(),
            email text,
            raw_user_meta_data jsonb default '{}'::jsonb,
            created_at timestamptz default now()
          );
          create table if not exists storage.buckets (
            id text primary key, name text, public boolean default false,
            created_at timestamptz default now()
          );
          create table if not exists storage.objects (
            id uuid primary key default gen_random_uuid(),
            bucket_id text references storage.buckets(id),
            name text, owner uuid, metadata jsonb, path_tokens text[],
            created_at timestamptz default now()
          );
          alter table storage.objects enable row level security;
          SQL
      # Applies every migration in order, then re-applies the last one, because
      # a migration Michael has to re-run must survive being run twice.
      - name: Apply every migration in order, to a real database
        env:
          PGURL: postgres://postgres:postgres@localhost:5432/greenway
        run: npx tsx scripts/compliance/verify-migrations-execute.ts

  # ==========================================================================
  # STANDING RULE 65: if a build system can catch it, CI must catch it first.
  #
  # WHY THIS JOB EXISTS. For several slices every Vercel deployment - preview
  # AND production - failed with:
  #
  #     the chunking context (unknown) does not support external modules
  #     (request: node:fs)
  #
  # and this workflow was GREEN for every one of them. The compliance job runs
  # vitest, the pure self-tests and a scoped lint. The migrations job runs SQL
  # against a real Postgres. Neither has ever run `next build`, which is the
  # only thing that bundles client components - so the one surface that was
  # broken was the one surface nothing looked at. Michael could not see any new
  # work on his own site and nothing here said why.
  #
  # A tests/compliance/client-bundle-purity.test.ts guard now catches the
  # specific node:fs class of defect in milliseconds. This job is the backstop
  # for everything that guard cannot model, which is most of what a bundler
  # does. Green CI must mean the site actually builds.
  # ==========================================================================
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      # The same command Vercel runs - and now, finally, under the same memory
      # ceiling. The previous version of this comment claimed NODE_OPTIONS here
      # "mirrors the headroom a Vercel build machine has (8 GB)". It did not:
      # it granted 6144 MB where Vercel gets Node's default of roughly half of
      # an 8192 MB container (~4096 MB). That mistaken belief is why this job
      # stayed green through three slices that Vercel could not deploy.
      - name: next build (the command Vercel runs)
        # NO NODE_OPTIONS override here any more, and that is the point.
        #
        # This step used to set --max-old-space-size=6144 while Vercel got
        # Node's DEFAULT heap, which is roughly half of system RAM and so lands
        # near 4096 MB on Vercel's documented 8192 MB build container. CI was
        # therefore building with ~50% more heap than the machine that actually
        # deploys, and that gap is precisely why this job kept passing on
        # commits Vercel could not build. A "the command Vercel runs" check that
        # runs it with different memory is not the check it claims to be.
        #
        # The heap is now declared once, in the `build` script in package.json,
        # so CI and Vercel run the same command with the same ceiling.
        # NO Supabase placeholders here on purpose. It is tempting to add
        # NEXT_PUBLIC_* stand-ins "just in case", but a local `next build` in
        # this repo compiles with none of them set, so adding them would be
        # inventing a default nobody proved was needed (rule 62d) - and a fake
        # URL that silences a real "you forgot to configure this" error is
        # exactly the kind of helpfulness that hides a defect. If this job ever
        # fails for a missing variable, the fix is to read the error and add
        # the ONE variable it names.
        run: npm run build
