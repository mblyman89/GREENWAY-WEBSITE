# G-71e (owner message 14, item 5): locked versions plus upgrade pull requests
# through CI.
#
# package.json pins every dependency to one exact version (no ^ or ~), and
# .npmrc has save-exact=true. Nothing changes version unless a pull request
# changes it, and every pull request runs the full gate in
# .github/workflows/compliance-tests.yml (vitest, pure self-tests, commit
# authorship, verbatim quotes, tsc, lint, the migrations job and next build).
#
# Dependabot opens those pull requests. It does NOT merge them, and its commits
# cannot be merged as they are: they are authored by dependabot[bot], which
# fails the commit authorship check, and Vercel will not deploy them (AGENTS.md
# rules 6 and 7). The upgrade procedure is AGENTS.md standing rule 17:
#   1. read the release notes of each package in the PR;
#   2. re-author the PR's commits as Greenway Dev on the same branch
#      (git rebase origin/main --exec "git commit --amend --no-edit --reset-author"
#       with user.name/user.email set) and force-push;
#   3. wait for every CI job to pass; 4. rebase-merge; 5. verify production.
#
# tests/compliance/g71e-version-pins.test.ts keeps this file in step with the
# package files and the workflow.
version: 2
updates:
  # The main site (greenwaymarijuana.com) and the register app share this
  # package.json. Minor and patch releases arrive grouped in one weekly PR so
  # the gate runs once; each major arrives in its own PR because majors break.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    versioning-strategy: "increase"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    groups:
      site-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # greenwaymerch.com (separate Vercel project, root directory merch-site/).
  - package-ecosystem: "npm"
    directory: "/merch-site"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Los_Angeles"
    versioning-strategy: "increase"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    commit-message:
      prefix: "deps(merch)"
    labels:
      - "dependencies"
    groups:
      merch-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # The actions in .github/workflows are pinned to commit SHAs; Dependabot
  # updates the SHA and the "# vX.Y.Z" comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      timezone: "America/Los_Angeles"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"
